<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C5221F"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1F2A44">VPC peering is not transitive</text>
  <text x="30" y="56" font-size="12" fill="#5F6368">Each pair of networks that must talk needs its own peering. Subnet ranges can never overlap.</text>

  <!-- VPC boxes -->
  <g>
    <rect x="40" y="85" width="230" height="110" rx="12" fill="#F8FBFF" stroke="#1A73E8" stroke-width="1.5"/>
    <text x="60" y="113" font-size="15" font-weight="bold" fill="#1A73E8">vpc-prod</text>
    <text x="60" y="135" font-size="12" fill="#5F6368">web-vm · db-vm</text>
    <rect x="60" y="150" width="190" height="28" rx="6" fill="#E8F0FE"/><text x="155" y="169" text-anchor="middle" font-size="12" fill="#1A73E8" font-weight="bold">10.10.0.0/24 · 10.20.0.0/24</text>

    <rect x="385" y="85" width="230" height="110" rx="12" fill="#F3FAF5" stroke="#188038" stroke-width="1.5"/>
    <text x="405" y="113" font-size="15" font-weight="bold" fill="#188038">vpc-shared</text>
    <text x="405" y="135" font-size="12" fill="#5F6368">tools-vm</text>
    <rect x="405" y="150" width="190" height="28" rx="6" fill="#E6F4EA"/><text x="500" y="169" text-anchor="middle" font-size="12" fill="#188038" font-weight="bold">10.30.0.0/24</text>

    <rect x="730" y="85" width="230" height="110" rx="12" fill="#FAFAFA" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="750" y="113" font-size="15" font-weight="bold" fill="#3C4043">vpc-partner</text>
    <text x="750" y="135" font-size="12" fill="#5F6368">partner-vm (challenge)</text>
    <rect x="750" y="150" width="190" height="28" rx="6" fill="#F1F3F4"/><text x="845" y="169" text-anchor="middle" font-size="12" fill="#3C4043" font-weight="bold">10.40.0.0/24</text>
  </g>

  <line x1="275" y1="140" x2="380" y2="140" stroke="#188038" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="327" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#188038">peered</text>
  <line x1="620" y1="140" x2="725" y2="140" stroke="#188038" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="672" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#188038">peered</text>

  <path d="M155 200 L155 245 L845 245 L845 200" fill="none" stroke="#C5221F" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#r)" marker-end="url(#r)"/>
  <rect x="350" y="228" width="300" height="34" rx="8" fill="#FCE8E6" stroke="#F4B4AE"/>
  <text x="500" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#C5221F">prod ↔ partner: no route through shared</text>
  <text x="500" y="295" text-anchor="middle" font-size="12" fill="#5F6368">Fix: create a direct prod ↔ partner peering, or use a hub such as Network Connectivity Center.</text>
</svg>
